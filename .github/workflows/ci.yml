name: CI

# I push su main li costruisce test-build.yml (build per lo staging con build
# number automatico), qui restano le PR.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint e test unitari. I test e2e (tag `e2e`) servono un repbirds-api avviato
  # e senza i --dart-define vengono saltati, quindi qui restano fuori.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --exclude-tags e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Release firmato con le chiavi di debug finché non c'è un keystore vero
      # (vedi android/app/build.gradle.kts): non è pubblicabile sullo store.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: repbirds-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Solo compilazione: senza certificati non si può firmare né creare l'IPA.
      - run: flutter build ios --release --no-codesign
