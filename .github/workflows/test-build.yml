name: Test build

# Ogni push su main crea le build Android e iOS che puntano allo staging
# (testapi.repbirds.com). La versione resta quella di pubspec.yaml (1.0.0),
# il build number sale da solo a ogni push: build di pubspec + numero del run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Una build alla volta, senza annullare quella in corso: ogni push ha il suo numero.
concurrency:
  group: test-build
  cancel-in-progress: false

env:
  API_BASE_URL: https://testapi.repbirds.com/api

jobs:
  # Lint e test unitari, come nella CI delle PR. Calcola anche versione e build number.
  test:
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.version.outputs.build-name }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          name=${version%%+*}
          base=$(echo "${version#*+}" | tr -cd '0-9')
          number=$(( ${base:-0} + GITHUB_RUN_NUMBER ))
          echo "build-name=$name" >> "$GITHUB_OUTPUT"
          echo "build-number=$number" >> "$GITHUB_OUTPUT"
          echo "### RepBirds $name ($number) → $API_BASE_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --exclude-tags e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      BUILD_FLAGS: >-
        --build-name=${{ needs.test.outputs.build-name }}
        --build-number=${{ needs.test.outputs.build-number }}
        --dart-define=API_BASE_URL=https://testapi.repbirds.com/api
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Con il keystore nei secret le build sono firmate con la chiave di upload
      # (vedi android/app/build.gradle.kts), altrimenti con quella di debug:
      # l'APK si installa lo stesso, ma Play rifiuta l'AAB.
      - name: Upload key
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - name: No upload key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 non impostato, build firmate con la chiave di debug"

      - run: flutter build apk --release $BUILD_FLAGS
      - run: flutter build appbundle --release $BUILD_FLAGS

      - uses: actions/upload-artifact@v7
        with:
          name: repbirds-android-${{ needs.test.outputs.build-number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    needs: test
    runs-on: macos-latest
    env:
      BUILD_FLAGS: >-
        --build-name=${{ needs.test.outputs.build-name }}
        --build-number=${{ needs.test.outputs.build-number }}
        --dart-define=API_BASE_URL=https://testapi.repbirds.com/api
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Senza certificati si può solo compilare: niente IPA.
      - name: Build without signing
        if: env.CERTIFICATE_BASE64 == '' || env.ASC_KEY_ID == ''
        run: |
          echo "::warning::Certificati iOS o chiave App Store Connect mancanti, build senza firma e senza IPA"
          flutter build ios --release --no-codesign $BUILD_FLAGS

      # Il progetto usa la firma automatica: Xcode prende i certificati dal
      # keychain e crea o aggiorna da solo i profili (app e widget) con la
      # chiave API di App Store Connect.
      - name: Signing
        if: env.CERTIFICATE_BASE64 != '' && env.ASC_KEY_ID != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # La chiave .p8 può arrivare come file intero, su una riga sola, con "\n"
          # letterali o in base64: si tiene solo il corpo e si ricostruisce il PEM.
          body=$(printf '%s' "$ASC_KEY_P8" | sed 's/\\n/ /g; s/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          decoded=$(printf '%s' "$body" | base64 --decode 2>/dev/null | tr -d '\0' || true)
          if [[ "$decoded" == *"BEGIN PRIVATE KEY"* ]]; then
            body=$(printf '%s' "$decoded" | sed 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          fi
          key_file=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          mkdir -p ~/.appstoreconnect/private_keys
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key_file"
          openssl pkey -in "$key_file" -noout \
            || { echo "::error::APP_STORE_CONNECT_KEY_P8 non è una chiave .p8 valida"; exit 1; }

      - name: Build IPA
        if: env.CERTIFICATE_BASE64 != '' && env.ASC_KEY_ID != ''
        run: |
          # Scrive versione, build number e dart-define in Generated.xcconfig,
          # poi archivia ed esporta con xcodebuild per poter passare la chiave API.
          flutter build ios --release --config-only $BUILD_FLAGS
          auth=(-allowProvisioningUpdates
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath build/ios/archive/Runner.xcarchive \
            "${auth[@]}" archive
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ios/ipa "${auth[@]}"

      - uses: actions/upload-artifact@v7
        if: env.CERTIFICATE_BASE64 != '' && env.ASC_KEY_ID != ''
        with:
          name: repbirds-ios-${{ needs.test.outputs.build-number }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # Su TestFlight solo se richiesto con la variabile di repository
      # TESTFLIGHT_UPLOAD=true; altrimenti l'IPA resta tra gli artifact.
      - name: Upload to TestFlight
        if: env.CERTIFICATE_BASE64 != '' && env.ASC_KEY_ID != '' && vars.TESTFLIGHT_UPLOAD == 'true'
        run: |
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always() && env.CERTIFICATE_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
