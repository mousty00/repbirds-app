name: gymbro_app
description: "RepBirds: allenati da solo o in gruppo. Client Flutter per gymbro-api."
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  intl: any
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/sounds/

# Splash nativo (iOS + Android, incluso Android 12+). Dopo ogni modifica:
#   dart run flutter_native_splash:create
# Tinta unita del logo (AppColors.brand) in entrambi i temi, come lo splash
# animato in-app (lib/features/onboarding/splash_screen.dart) che lo segue.
flutter_native_splash:
  color: "#6366F1"
  image: assets/splash/logo.png
  android_12:
    color: "#6366F1"
    image: assets/splash/logo_android12.png
  fullscreen: false
  web: false
